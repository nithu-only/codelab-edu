services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: codelab-backend
    ports:
      - "8080:8080"
    volumes:
      # Docker-in-Docker via host socket — backend's DockerExecutor calls `docker run`
      - /var/run/docker.sock:/var/run/docker.sock
      # Optional: mount temp dir for debugging (not required)
    environment:
      - SERVER_PORT=8080
      - SPRING_APPLICATION_NAME=codelab-backend
      # Add any future env overrides here; see .env.example
    env_file:
      - path: .env
        required: false
    restart: unless-stopped
    # Healthcheck hits CONTRACT.md /api/health
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://localhost:8080/api/health | grep -q UP"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 40s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        # Use relative /api so nginx proxies to backend; override via .env if needed
        VITE_API_URL: ${VITE_API_URL:-/api}
    container_name: codelab-frontend
    ports:
      - "5173:80"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
