# CodeLab Edu — Netlify configuration.
# Deploy this directory ("app") as the site base directory.

[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"

[functions]
  node_bundler = "esbuild"

# IMPORTANT — order matters: first matching rule wins.
# 1) Expose the execution proxy under /api/* BEFORE the SPA fallback,
#    otherwise /* would rewrite function URLs to index.html.
# 2) SPA history fallback for the React Router routes.
[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/:splat"
  status = 200

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
